<script type="module">

import {
obtenerProductos,
editarProducto
}
from "/src/lib/inventario.js";

import {
registrarVenta
}
from "/src/lib/ventas.js";


/*
=====================
ESTADO
=====================
*/

let inventario=[];

let carrito=[];


/*
=====================
SELECTORES
=====================
*/

const buscador=
document.querySelector(
'input[type="text"]'
);

const contenedor=
document.querySelector(
".space-y-2"
);

const subtotalUI=
document.querySelectorAll(
".text-on-surface-variant span:last-child"
)[0];

const ivaUI=
document.querySelectorAll(
".text-on-surface-variant span:last-child"
)[1];

const totalUI=
document.querySelector(
".text-primary.leading-none"
);

const btnPagar=
document.querySelector(
".bg-primary.py-4"
);

const btnNueva=
[
...document.querySelectorAll(
"button"
)
]
.find(
b=>
b.textContent
.includes(
"NUEVA"
)
);


/*
=====================
INICIO
=====================
*/

async function iniciar(){

inventario=
await obtenerProductos();

render();

}

iniciar();


/*
=====================
BUSCADOR
=====================
*/

buscador.addEventListener(
"keydown",

e=>{

if(
e.key!=="Enter"
)
return;

e.preventDefault();

buscar(
buscador.value
);

buscador.value="";

}

);


function buscar(valor){

const p=
inventario.find(

x=>

x.nombre
?.toLowerCase()
.includes(
valor
.toLowerCase()
)

||

x.sku
===valor

||

x.codigoBarras
===valor

);

if(
!p
){

alert(
"Producto no encontrado"
);

return;

}

agregar(
p);

}


/*
=====================
AGREGAR
=====================
*/

function agregar(p){

if(
p.stock<=0
){

alert(
"Sin stock"
);

return;

}

const existe=
carrito.find(
x=>
x.id===p.id
);

if(
existe
){

if(
existe.cantidad
>=
p.stock
){

alert(
"Stock insuficiente"
);

return;

}

existe.cantidad++;

}

else{

carrito.push({

...p,

cantidad:1

});

}

render();

}


/*
=====================
RENDER
=====================
*/

function render(){

contenedor.innerHTML="";

let subtotal=0;

carrito.forEach(
(item,i)=>{

const sub=
item.precioVenta
*
item.cantidad;

subtotal+=sub;

contenedor.innerHTML+=`

<div
class="
grid
grid-cols-12
gap-4
items-center
bg-surface-container-low
p-4
rounded-xl
">

<div class="col-span-6">

${item.nombre}

<br>

<span class="text-xs">

SKU:
${item.sku}

</span>

</div>

<div class="col-span-2 text-center">

$

${item.precioVenta}

</div>

<div class="col-span-2 flex justify-center gap-2">

<button
class="menos"
data="${i}"
>

−

</button>

<span>

${item.cantidad}

</span>

<button
class="mas"
data="${i}"
>

+

</button>

</div>

<div
class="
col-span-2
flex
justify-end
gap-4
"
>

$

${sub}

<button
class="borrar"
data="${i}"
>

🗑

</button>

</div>

</div>

`;

});


eventos();


const iva=
subtotal
*
0.16;

const total=
subtotal
+
iva;

subtotalUI.textContent=
"$"+
subtotal.toFixed(2);

ivaUI.textContent=
"$"+
iva.toFixed(2);

totalUI.textContent=
"$"+
total.toFixed(2);

}


/*
=====================
EVENTOS
=====================
*/

function eventos(){

document
.querySelectorAll(
".mas"
)
.forEach(
b=>
b.onclick=
()=>{

carrito[
b.dataset
]
.cantidad++;

render();

}
);

document
.querySelectorAll(
".menos"
)
.forEach(
b=>
b.onclick=
()=>{

const x=
carrito[
b.dataset
];

x.cantidad--;

if(
x.cantidad<=0
)
carrito.splice(
b.dataset,
1
);

render();

}
);

document
.querySelectorAll(
".borrar"
)
.forEach(
b=>
b.onclick=
()=>{

carrito.splice(
b.dataset,
1
);

render();

}
);

}


/*
=====================
PAGAR
=====================
*/

btnPagar.onclick=
async()=>{

if(
!carrito.length
){

alert(
"Carrito vacío"
);

return;

}

for(
const p
of
carrito
){

await editarProducto(

p.id,

{

stock:
p.stock
-
p.cantidad,

ventas24h:
(
p.ventas24h
||
0
)
+
(
p.precioVenta
*
p.cantidad
)

}

);

}

await registrarVenta({

productos:
carrito,

subtotal:
carrito.reduce(
(a,b)=>
a+
(
b.precioVenta
*
b.cantidad
),
0
),

iva:16,

total:
carrito.reduce(
(a,b)=>
a+
(
b.precioVenta
*
b.cantidad
),
0
)
*
1.16

});

alert(
"Venta completada"
);

carrito=[];

render();

inventario=
await obtenerProductos();

};


/*
=====================
NUEVA VENTA
=====================
*/

btnNueva.onclick=
()=>{

carrito=[];

render();

};

</script>
